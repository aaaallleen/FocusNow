    <circle cx="284" cy="581" r="6.5" fill="#FFFBEE"/>

    <!-- caps -->
    <rect x="204" y="77"  width="355" height="61" rx="30.5" fill="#15262F"/>
    <rect x="204" y="675" width="355" height="62" rx="31"   fill="#1B2E36"/>
