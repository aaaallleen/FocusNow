    <linearGradient id="pile" gradientUnits="userSpaceOnUse" x1="0" y1="596" x2="0" y2="672">
      <stop offset="0" stop-color="#FDF3DB"/>
      <stop offset="1" stop-color="#FEE7C3"/>
    </linearGradient>
