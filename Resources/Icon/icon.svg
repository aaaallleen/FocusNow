  <!-- hourglass -->
  <g transform="translate(360,362) scale(0.74) translate(-381,-407)">
    <path d="M237,138 H525 V190 C525,270 462,300 422,330 C407,342 402,365 402,395 C402,445 432,465 462,485 C497,515 525,545 525,610 V675 H237 V610 C237,545 265,515 300,485 C330,465 360,445 360,395 C360,365 355,342 340,330 C300,300 237,270 237,190 Z" fill="url(#glassFill)"/>
    <g clip-path="url(#glassClip)">
