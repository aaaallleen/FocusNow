<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-label="Hourglass icon" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="tile"><rect width="720" height="720" rx="190" ry="190"/></clipPath>
    <clipPath id="glassClip"><path d="M237,138 H525 V190 C525,270 462,300 422,330 C407,342 402,365 402,395 C402,445 432,465 462,485 C497,515 525,545 525,610 V675 H237 V610 C237,545 265,515 300,485 C330,465 360,445 360,395 C360,365 355,342 340,330 C300,300 237,270 237,190 Z"/></clipPath>

    <radialGradient id="bg" gradientUnits="userSpaceOnUse" cx="360" cy="360" r="430">
      <stop offset="0"    stop-color="#FEF7E2"/>
      <stop offset="0.45" stop-color="#FDF6E1"/>
      <stop offset="0.55" stop-color="#FAF2DE"/>
      <stop offset="0.76" stop-color="#E3DBCB"/>
      <stop offset="0.82" stop-color="#D8D4C7"/>
      <stop offset="1"    stop-color="#CACBC3"/>
    </radialGradient>

    <linearGradient id="glassFill" gradientUnits="userSpaceOnUse" x1="0" y1="138" x2="0" y2="675">
      <stop offset="0"    stop-color="#2B5869"/>
      <stop offset="0.10" stop-color="#326374"/>
      <stop offset="0.35" stop-color="#3D717F"/>
      <stop offset="0.85" stop-color="#4C7E8B"/>
      <stop offset="1"    stop-color="#4E808C"/>
    </linearGradient>

    <radialGradient id="glassGlow" gradientUnits="userSpaceOnUse" cx="381" cy="400" r="175">
      <stop offset="0" stop-color="#FFF6E0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF6E0" stop-opacity="0"/>
