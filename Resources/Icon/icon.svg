    <line x1="513.9" y1="476.0" x2="599.6" y2="540.5" stroke="#FFF4DE" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <line x1="513.9" y1="244.0" x2="599.6" y2="179.5" stroke="#FFF4DE" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <line x1="206.1" y1="476.0" x2="120.4" y2="540.5" stroke="#FFF4DE" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <line x1="206.1" y1="244.0" x2="120.4" y2="179.5" stroke="#FFF4DE" stroke-width="5" stroke-linecap="round" opacity="0.35"/>

