    <linearGradient id="capShade" gradientUnits="userSpaceOnUse" x1="0" y1="138" x2="0" y2="172">
      <stop offset="0" stop-color="#0A1E28" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A1E28" stop-opacity="0"/>
