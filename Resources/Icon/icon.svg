    <line x1="204.3" y1="277.2" x2="68.6" y2="205.1" stroke="#FFF4DE" stroke-width="6.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="509.2" y1="514.5" x2="606.6" y2="615.4" stroke="#FFF4DE" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <line x1="509.2" y1="205.5" x2="606.6" y2="104.6" stroke="#FFF4DE" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <line x1="210.8" y1="514.5" x2="113.4" y2="615.4" stroke="#FFF4DE" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <line x1="210.8" y1="205.5" x2="113.4" y2="104.6" stroke="#FFF4DE" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <line x1="541.1" y1="425.9" x2="634.4" y2="459.9" stroke="#FFF4DE" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <line x1="541.1" y1="294.1" x2="634.4" y2="260.1" stroke="#FFF4DE" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <line x1="178.9" y1="425.9" x2="85.6" y2="459.9" stroke="#FFF4DE" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
