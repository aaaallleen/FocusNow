    <line x1="515.7" y1="442.8" x2="651.4" y2="514.9" stroke="#FFF4DE" stroke-width="6.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="515.7" y1="277.2" x2="651.4" y2="205.1" stroke="#FFF4DE" stroke-width="6.5" stroke-linecap="round" opacity="0.8"/>
